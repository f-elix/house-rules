name: Unit tests

on:
    push:
        branches-ignore:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: package.json

            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Test
              run: pnpm test
